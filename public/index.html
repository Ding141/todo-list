<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日程规划</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23161614'/%3E%3Cpath d='M9.5 16.5l4.2 4.2 8.8-9.4' stroke='%23F2F2EF' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/board.css" />
  <link rel="stylesheet" href="css/calendar.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <script src="js/theme-init.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./">
        <span class="brand-en">Planner</span>
        <span class="brand-cn">日程规划</span>
      </a>
      <div class="top-actions">
        <span class="sync" id="sync"><i></i><span id="syncText"></span></span>
        <button class="icon-btn" id="exportBtn" title="导出 JSON" aria-label="导出 JSON"></button>
        <button class="icon-btn" id="importBtn" title="导入 JSON" aria-label="导入 JSON"></button>
        <button class="icon-btn" id="themeBtn" title="切换明暗" aria-label="切换明暗"></button>
        <input type="file" id="importFile" accept="application/json" hidden />
      </div>
    </header>

    <div class="layout">
      <main class="main">
        <section class="intro">
          <div>
            <div class="eyebrow" id="eyebrow"></div>
            <h1 id="greeting"></h1>
          </div>
          <div class="stats" id="stats"></div>
        </section>

        <div class="section-head">
          <h2>全部板块</h2>
          <button class="btn btn-primary" id="addBoardBtn"></button>
        </div>
        <div class="boards boot" id="boards"></div>
      </main>

      <aside class="side">
        <section class="cal" id="cal" aria-label="月历"></section>
      </aside>
    </div>
  </div>

  <div class="backdrop" id="modal" hidden>
    <form class="modal" id="modalForm" autocomplete="off"></form>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/render.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
