<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日程规划</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236366f1'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme-init.js"></script>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo">✓</span>
      <span class="brand-name">日程规划</span>
    </div>
    <div class="top-actions">
      <span class="sync-badge" id="syncBadge"></span>
      <button class="icon-btn" id="exportBtn" title="导出 JSON"></button>
      <button class="icon-btn" id="importBtn" title="导入 JSON"></button>
      <button class="icon-btn" id="themeBtn" title="切换主题"></button>
      <input type="file" id="importFile" accept="application/json" hidden />
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div>
        <p class="hero-date" id="heroDate"></p>
        <h1 class="hero-title" id="heroTitle"></h1>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <div class="section-head">
      <h2>我的板块</h2>
      <button class="btn btn-primary" id="addBoardBtn"></button>
    </div>

    <section class="board-grid" id="boardGrid"></section>
  </main>

  <div class="modal-backdrop" id="modal" hidden>
    <form class="modal" id="modalForm" autocomplete="off"></form>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
